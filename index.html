<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefing Criativo | Imperium Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * {
      font-family: 'Inter', sans-serif;
    }

    .gradient-bg-sites {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
    }

    .gradient-bg-logo {
      background: linear-gradient(135deg, #1a0f1a 0%, #2e1a1a 50%, #3e1616 100%);
    }

    .card-hover {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .input-focus {
      transition: all 0.3s ease;
    }

    .input-focus:focus {
      transform: scale(1.02);
    }

    .progress-bar-sites {
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
      height: 4px;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .progress-bar-logo {
      background: linear-gradient(90deg, #f97316, #ec4899, #f59e0b);
      height: 4px;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-active {
      background: rgba(255, 255, 255, 0.2);
      border-bottom: 3px solid;
    }

    .tab-inactive {
      background: rgba(255, 255, 255, 0.05);
      opacity: 0.7;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.5s ease-in-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 🔹 Logo Imperium Flutuante */
    .imperium-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      padding: 10px;
      transition: all 0.3s ease;
    }

    .imperium-float:hover {
      transform: scale(1.1);
      background-color: rgba(255, 255, 255, 0.15);
    }

    .imperium-float img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.3));
    }
  </style>
</head>

<body class="min-h-full gradient-bg-sites" id="mainBody">
  <!-- Barra de Progresso -->
  <div class="fixed top-0 left-0 w-full z-50">
    <div id="progressBar" class="progress-bar-sites" style="width: 0%"></div>
  </div>

  <!-- Conteúdo principal -->
  <div class="min-h-full py-12 px-4">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-16 floating">
        <div id="heroIcon"
          class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl shadow-2xl mb-8 glow-sites">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
        </div>
        <h1
          class="text-6xl font-black text-white mb-6 bg-gradient-to-r from-white to-gray-300 bg-clip-text text-transparent">
          Imperium Design
        </h1>
        <p class="text-2xl text-gray-300 font-light max-w-2xl mx-auto leading-relaxed">
          Transformando suas ideias em experiências digitais extraordinárias
        </p>
      </div>

      <!-- Botão principal -->
      <div class="text-center mt-12">
        <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 p-8 rounded-3xl shadow-2xl glow-sites">
          <h3 class="text-3xl font-bold text-white mb-4">Pronto para decolar? 🚀</h3>
          <p class="text-xl text-white/90 mb-8 max-w-2xl mx-auto">
            Envie seu briefing e nossa equipe vai transformar suas respostas em um projeto incrível!
          </p>
          <button onclick="enviarParaWhatsApp()"
            class="bg-white text-indigo-600 px-12 py-5 rounded-2xl font-bold text-xl hover:bg-gray-100 transition-all duration-300 transform hover:scale-105 shadow-2xl">
            ✨ Enviar Briefing
          </button>
        </div>
      </div>

      <!-- Rodapé -->
      <div class="text-center text-gray-400 mt-12">
        <p class="text-lg">© 2025 Imperium Design</p>
        <p class="text-sm opacity-75">Transformando visões em realidade digital</p>
      </div>
    </div>
  </div>

  <!-- 🔹 Logo Flutuante da Imperium -->
  <a href="https://wa.me/5598984966362?text=Olá,%20vim%20do%20briefing%20Imperium%20Design!"
    target="_blank" class="imperium-float" title="Fale com a Imperium">
    <img src="logo-imperium.png" alt="Imperium Design">
  </a>

  <script>
    // Função de envio do Briefing
    function enviarParaWhatsApp() {
      const nome = prompt("Digite seu nome:");
      if (!nome) return alert("Por favor, informe seu nome para enviar o briefing.");

      const mensagem = `🚀 *NOVO BRIEFING - IMPERIUM DESIGN*\n\nCliente: ${nome}\n\nVamos transformar essa ideia em realidade!`;

      const mensagemCodificada = encodeURIComponent(mensagem);
      const urlWhatsApp = `https://wa.me/5598984966362?text=${mensagemCodificada}`;

      // 🔹 Correção do envio — compatível com celular e desktop
      window.location.href = urlWhatsApp;
    }

    // Barra de progresso
    window.addEventListener("scroll", () => {
      const scrolled =
        (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
      document.getElementById("progressBar").style.width = scrolled + "%";
    });
  </script>
</body>
</html>
