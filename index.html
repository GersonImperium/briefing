<title>Briefing Criativo | Imperium Design</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* --- Mantém todos os estilos originais --- */
body {
  box-sizing: border-box;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
* {
  font-family: 'Inter', sans-serif;
}
/* Gradientes e efeitos */
.gradient-bg-sites {
  background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
}
.gradient-bg-logo {
  background: linear-gradient(135deg, #1a0f1a 0%, #2e1a1a 50%, #3e1616 100%);
}
/* Efeito de hover nos cards */
.card-hover {
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.card-hover:hover {
  transform: translateY(-8px);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}
/* Inputs e animações */
.input-focus {
  transition: all 0.3s ease;
}
.input-focus:focus {
  transform: scale(1.02);
}
.upload-area {
  border: 2px dashed rgba(255, 255, 255, 0.3);
  transition: all 0.3s ease;
}
.upload-area:hover {
  border-color: rgba(255, 255, 255, 0.6);
  background: rgba(255, 255, 255, 0.05);
}
.upload-area.dragover {
  border-color: #6366f1;
  background: rgba(99, 102, 241, 0.1);
}
/* Logo flutuante discreta */
.imperium-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  background-color: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  padding: 10px;
  transition: all 0.3s ease;
}
.imperium-float:hover {
  transform: scale(1.1);
  background-color: rgba(255,255,255,0.15);
}
.imperium-float img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.3));
}
</style>
</head>
<body class="min-h-full gradient-bg-sites" id="mainBody">

<script>
/* Correção no envio para WhatsApp */
function enviarParaWhatsApp(tipo) {
  let mensagem = "";
  if (tipo === "sites") {
    const nome = document.getElementById("nomeEmpresa").value.trim();
    if (!nome) {
      alert("Por favor, preencha o nome da empresa.");
      return;
    }
    mensagem = `🚀 *BRIEFING DE SITE - IMPERIUM DESIGN* \n\nEmpresa: ${nome}\n\n`;
  } else {
    const nome = document.getElementById("nomeMarca").value.trim();
    if (!nome) {
      alert("Por favor, preencha o nome da marca.");
      return;
    }
    mensagem = `🎨 *BRIEFING DE LOGO - IMPERIUM DESIGN* \n\nMarca: ${nome}\n\n`;
  }
  
  const url = "https://wa.me/5598984966362?text=" + encodeURIComponent(mensagem);
  window.location.href = url; // ✅ Corrigido (funciona em todos os dispositivos)
}
</script>
